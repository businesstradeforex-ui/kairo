[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kairo"
version = "1.2.0"
description = "Solana memecoin paper desk. Six agents, local AI as the executor, live trading off by default."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kairo contributors" }]
dependencies = [
  "requests==2.32.3",
  "websockets==13.1",
  "cryptography==44.0.0",
  "PyNaCl==1.5.0",
  "base58==2.1.1",
]

[project.scripts]
kairo = "kairo_launch:main"

[tool.setuptools]
py-modules = ["kairo_launch"]
packages = ["kairo"]

[tool.setuptools.package-data]
kairo = ["static/**/*", "profile.txt", "deploy/**/*", "backtest_chart.json"]
